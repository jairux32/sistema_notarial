name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: test-secret-key

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng libgl1 libglib2.0-0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Import smoke check
        run: |
          python -c "import fitz, flask, pytesseract; import importlib.util; s=importlib.util.spec_from_file_location('_flask_app','app.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print('imports OK')"

      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -v --tb=short -x > pytest-out.txt 2>&1
          code=$?
          cat pytest-out.txt

          # Visible en la API de annotations sin descargar logs
          if [ "$code" -ne 0 ]; then
            echo "::error::pytest failed with exit code ${code}"
            # Las últimas líneas relevantes como error annotations
            grep -E 'FAILED|ERROR|Error|assert |E   |short test summary|exit' pytest-out.txt | tail -n 30 | while IFS= read -r line; do
              line_flat=${line//$'\n'/ }
              echo "::error::${line_flat}"
            done
          fi

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## Pytest (exit ${code})"
              echo '```'
              tail -n 200 pytest-out.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          exit "${code}"

      - name: Upload pytest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest-out.txt
          if-no-files-found: ignore
